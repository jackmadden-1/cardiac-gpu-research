<!doctype html>
<!--
  Numerical check for the WebGPU kernels (no rendering).
  Runs both compute shaders for a fixed number of steps from the same initial
  condition as fhn_2d.py and exposes the resulting v field as window.RESULT,
  so benchmarks/check_webgpu.py can compare it with the NumPy solvers.
  Query string: ?n=64&steps=2000&dt=0.05
-->
<html><head><meta charset="utf-8"><title>FHN WebGPU kernel test</title></head>
<body><pre id="out">running…</pre>
<script type="module">
import { FD_WGSL, LBM_WGSL } from './shaders.js';

const q = new URLSearchParams(location.search);
const n = +(q.get('n') ?? 64), steps = +(q.get('steps') ?? 2000), dt = +(q.get('dt') ?? 0.05);
const FHN = { a: 0.7, b: 0.8, eps: 0.08, D: 1.0, dx: 1.0 };
const out = document.getElementById('out');

try {
  const adapter = await navigator.gpu.requestAdapter();
  const device = await adapter.requestDevice();

  let vr = -1.2;
  for (let k = 0; k < 50; k++) {
    vr -= (vr - vr ** 3 / 3 - (vr + FHN.a) / FHN.b) / (1 - vr * vr - 1 / FHN.b);
  }
  const wr = (vr + FHN.a) / FHN.b;
  const N = n * n, s = n / 200;
  const v = new Float32Array(N).fill(vr), w = new Float32Array(N).fill(wr);
  for (let y = 0; y < n / 2; y++) for (let x = 0; x < n; x++) {
    const i = y * n + x;
    if (x >= 95 * s && x < 105 * s) v[i] = 1.5;
    if (x >= 80 * s && x < 95 * s) w[i] = 1.0;
  }

  const u = new ArrayBuffer(64), U = new Uint32Array(u), F = new Float32Array(u);
  U[0] = n; U[1] = n; U[2] = 0;
  F[4] = dt; F[5] = FHN.dx; F[6] = FHN.D; F[7] = FHN.a; F[8] = FHN.b; F[9] = FHN.eps;
  F[10] = 0.5 + 3 * FHN.D * dt / FHN.dx ** 2;
  const uniform = device.createBuffer({ size: 64, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(uniform, 0, u);

  const buf = d => { const b = device.createBuffer({ size: d.byteLength,
      usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC });
    device.queue.writeBuffer(b, 0, d); return b; };

  async function run(code, buffersA, buffersB, extra) {
    const pipe = device.createComputePipeline({ layout: 'auto',
      compute: { module: device.createShaderModule({ code }), entryPoint: 'main' } });
    const vis = buf(v);
    const mk = (a, b) => device.createBindGroup({ layout: pipe.getBindGroupLayout(0),
      entries: [uniform, a, b, vis, ...extra].map((buffer, binding) => ({ binding, resource: { buffer } })) });
    const groups = [mk(buffersA, buffersB), mk(buffersB, buffersA)];
    const t0 = performance.now();
    const chunk = 500;
    for (let k0 = 0; k0 < steps; k0 += chunk) {
      const enc = device.createCommandEncoder();
      for (let k = k0; k < Math.min(steps, k0 + chunk); k++) {
        const p = enc.beginComputePass();
        p.setPipeline(pipe); p.setBindGroup(0, groups[k & 1]);
        p.dispatchWorkgroups(Math.ceil(n / 16), Math.ceil(n / 16)); p.end();
      }
      device.queue.submit([enc.finish()]);
    }
    const read = device.createBuffer({ size: N * 4, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
    const enc = device.createCommandEncoder();
    enc.copyBufferToBuffer(vis, 0, read, 0, N * 4);
    device.queue.submit([enc.finish()]);
    await read.mapAsync(GPUMapMode.READ);
    const res = Array.from(new Float32Array(read.getMappedRange()));
    return { v: res, ms: performance.now() - t0 };
  }

  const vw = new Float32Array(2 * N);
  for (let i = 0; i < N; i++) { vw[2 * i] = v[i]; vw[2 * i + 1] = w[i]; }
  const fd = await run(FD_WGSL, buf(vw), buf(vw), []);

  const f = new Float32Array(5 * N), wts = [1 / 3, 1 / 6, 1 / 6, 1 / 6, 1 / 6];
  for (let k = 0; k < 5; k++) for (let i = 0; i < N; i++) f[k * N + i] = wts[k] * v[i];
  const lbm = await run(LBM_WGSL, buf(f), buf(f), [buf(w)]);

  window.RESULT = { n, steps, dt, fd: fd.v, lbm: lbm.v, fd_ms: fd.ms, lbm_ms: lbm.ms };
  out.textContent = `done: n=${n} steps=${steps} fd ${fd.ms.toFixed(0)} ms, lbm ${lbm.ms.toFixed(0)} ms`;
} catch (e) {
  window.RESULT = { error: String(e) };
  out.textContent = 'error: ' + e;
}
</script></body></html>
